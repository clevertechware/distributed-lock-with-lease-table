name: lease-demo

# No volume on purpose: the demonstration wants an empty lease table at every start, not the rows
# left behind by the previous run.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d demo" ]
      interval: 2s
      timeout: 3s
      retries: 15
